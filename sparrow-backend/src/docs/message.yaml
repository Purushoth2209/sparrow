paths:
  /api/messages:
    get:
      summary: Get all messages
      description: |
        **🔒 Protected Route** - Authentication required (cookieAuth or bearerAuth)
        
        Get all messages for the current user. You must login first.
      tags:
        - Message
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/messages/{friendId}:
    get:
      summary: Get messages with a friend
      description: |
        **🔒 Protected Route** - Authentication required (cookieAuth or bearerAuth)
        
        Get all messages between current user and a specific friend. You must login first.
      tags:
        - Message
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: friendId
          required: true
          schema:
            type: string
          description: Profile ID of the friend
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '403':
          description: Cannot access messages with non-friend user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/messages/send:
    post:
      summary: Send a message
      description: |
        **🔒 Protected Route** - Authentication required (cookieAuth or bearerAuth)
        
        Send an encrypted message to a friend. You must login first.
      tags:
        - Message
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - receiverId
                - content
              properties:
                receiverId:
                  type: string
                  description: Profile ID of the receiver
                content:
                  type: string
                  description: Message content
      responses:
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/Message'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/messages/send/batch:
    post:
      summary: Send batch messages
      description: |
        **🔒 Protected Route** - Authentication required (cookieAuth or bearerAuth)
        
        Send multiple messages in a single batch (max 10 messages). You must login first.
      tags:
        - Message
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messages
              properties:
                messages:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required:
                      - receiverId
                      - content
                    properties:
                      receiverId:
                        type: string
                      content:
                        type: string
      responses:
        '200':
          description: Batch messages sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  count:
                    type: number
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/messages/markAsRead:
    post:
      summary: Mark messages as read
      description: |
        **🔒 Protected Route** - Authentication required (cookieAuth or bearerAuth)
        
        Mark all messages from a sender as read. You must login first.
      tags:
        - Message
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - senderId
              properties:
                senderId:
                  type: string
                  description: Profile ID of the sender
      responses:
        '200':
          description: Messages marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  updatedCount:
                    type: number
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/messages/updateStatus:
    post:
      summary: Update message status
      description: |
        **🌐 Public Route** - No authentication required
        
        Update the status of a message (sent, delivered, read). This endpoint is typically called by webhooks or external services.
      tags:
        - Message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messageId
                - status
              properties:
                messageId:
                  type: string
                status:
                  type: string
                  enum: [sent, delivered, read]
      responses:
        '200':
          description: Message status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/messages/stats/encryption:
    get:
      summary: Get encryption statistics
      description: |
        **🔒 Protected Route** - Authentication required (cookieAuth or bearerAuth)
        
        Get encryption statistics for monitoring. You must login first.
      tags:
        - Message
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Encryption statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  stats:
                    $ref: '#/components/schemas/EncryptionStats'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

