# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.sparrowchat.in;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name api.sparrowchat.in;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    ssl_certificate /etc/letsencrypt/live/api.sparrowchat.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sparrowchat.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_header_timeout 60;
    client_body_timeout   60;
    keepalive_timeout     60;

    gzip                  off;
    gzip_comp_level       4;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Include Elastic Beanstalk generated locations
    include conf.d/elasticbeanstalk/*.conf;

    # Proxy requests to Node.js backend
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
