name: Deploy to EC2

on:
  push:
    branches:
      - v2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/sparrow/sparrow-backend

            # Pull the latest commit from GitHub
            git fetch origin
            git reset --hard origin/v2

            # Install any new dependencies
            npm install

            # Stop old processes (cleanup)
            pm2 delete sparrow-api || true

            # Restart or start PM2 process
            pm2 restart sparrow-backend || pm2 start server.js --name sparrow-backend

